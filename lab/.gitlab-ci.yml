# PipeMind lab — deliberate failure generator.
# Run a pipeline manually with FAIL_MODE set to produce a known failure category.
#
#   none | dependency | dependency-404 | database | database-auth
#   test-assert | docker-space | network-dns | oom | env-missing | timeout

stages: [install, test, build]

variables:
  FAIL_MODE: "none"

install:
  stage: install
  image: node:20-alpine
  script:
    - |
      case "$FAIL_MODE" in
        dependency)     npm install vue@2 vue-router@4 ;;
        dependency-404) npm install this-package-does-not-exist-pipemind ;;
        env-missing)    test -n "$REQUIRED_SECRET" || { echo "ERROR: variable REQUIRED_SECRET not set"; exit 1; } ;;
        *)              echo "install ok" ;;
      esac

test:
  stage: test
  image: node:20-alpine
  services:
    - name: postgres:16-alpine
      alias: db
  variables:
    POSTGRES_PASSWORD: test
    POSTGRES_USER: test
    POSTGRES_DB: test
  script:
    - apk add --no-cache postgresql-client >/dev/null
    - |
      case "$FAIL_MODE" in
        database)
          echo "Connecting to database..."
          PGPASSWORD=test psql -h db -p 5433 -U test -d test -c 'select 1' \
            || { echo "SQLSTATE[HY000] [2002] Connection refused"; exit 1; } ;;
        database-auth)
          PGPASSWORD=wrong psql -h db -U test -d test -c 'select 1' ;;
        test-assert)
          echo "PASS home.test.ts"
          echo "FAIL login.test.ts"
          echo "  Expected status 200"
          echo "  Received status 401"
          echo "Tests: 1 failed, 1 passed"
          exit 1 ;;
        network-dns)
          wget -q -T5 http://this-host-does-not-exist.invalid \
            || { echo "getaddrinfo ENOTFOUND this-host-does-not-exist.invalid"; exit 1; } ;;
        oom)
          node -e "const a=[];while(true)a.push(Buffer.alloc(10485760));" ;;
        timeout)
          sleep 3600 ;;
        *) echo "all tests passed" ;;
      esac

build:
  stage: build
  image: docker:latest
  script:
    - |
      case "$FAIL_MODE" in
        docker-space) echo "write /var/lib/docker: no space left on device"; exit 1 ;;
        *) echo "build ok" ;;
      esac
